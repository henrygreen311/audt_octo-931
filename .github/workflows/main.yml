
name: audius

on:
  repository_dispatch:
    types: [run-sporty]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audius-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install Node.js dependencies
        timeout-minutes: 10
        run: |
          npm install --no-save --prefer-online \
            @audius/sdk@latest \
            @supabase/supabase-js@latest

      - name: Verify Node.js dependencies
        run: |
          node --version
          npm --version
          npm ls @audius/sdk @supabase/supabase-js

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

          python --version
          python -m playwright --version

      # Playwright OS dependencies
      - name: Install Chromium OS dependencies
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Installing Chromium OS dependencies..."
          date -u

          timeout --signal=TERM --kill-after=30s 10m \
            python -m playwright install-deps chromium

          echo "OS dependencies installed."
          date -u

      # Playwright browser
      - name: Install Playwright Chromium
        timeout-minutes: 12
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          echo "Downloading Chromium..."
          date -u

          timeout --signal=TERM --kill-after=30s 10m \
            python -m playwright install chromium

          python -m playwright install --list

          echo "Chromium installation completed."
          date -u

      # Xvfb
      - name: Install Xvfb
        timeout-minutes: 3
        run: |
          sudo apt-get install -y xvfb

      # Audius automation
      - name: Run login.py under Xvfb
        timeout-minutes: 340
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "Starting Audius monitor..."
          date -u

          timeout --signal=TERM --kill-after=60s 335m \
            xvfb-run -a \
            --server-args="-screen 0 1280x720x24" \
            python3 -u src/signup.py

          echo "Audius monitor finished."
          date -u

      # Next run
      - name: Trigger the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Triggering next run..."

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/dispatches" \
            -d '{"event_type":"run-sporty"}'

          echo "Next run triggered."
