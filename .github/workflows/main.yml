
name: audius

on:
  repository_dispatch:
    types: [run-sporty]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audius-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        timeout-minutes: 10
        run: |
          npm install --no-save --prefer-online \
            @audius/sdk@latest \
            @supabase/supabase-js@latest

      # Verify Node.js dependencies
      - name: Verify Node.js dependencies
        run: |
          node --version
          npm --version
          npm ls @audius/sdk @supabase/supabase-js

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip

          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

          python --version

      # Run Audius automation
      - name: Run login.py
        timeout-minutes: 340
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "Starting Audius monitor..."
          date -u

          timeout --signal=TERM --kill-after=60s 335m \
            python3 main.py favorite.js

          echo "Audius monitor finished."
          date -u
